name: Release Plugin

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version from manifest.json, without a v prefix"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          test "$VERSION" = "$MANIFEST_VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Test and build
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm lint
          pnpm lint:css
          pnpm build
      - name: Package plugin
        shell: bash
        run: |
          mkdir fast-note-sync
          cp main.js manifest.json styles.css fast-note-sync/
          zip -r "fast-note-sync-v${{ steps.version.outputs.value }}.zip" fast-note-sync
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            fast-note-sync-v${{ steps.version.outputs.value }}.zip
            main.js
            manifest.json
            styles.css
      - name: Attest plugin artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            fast-note-sync-v${{ steps.version.outputs.value }}.zip
            main.js
            manifest.json
            styles.css
